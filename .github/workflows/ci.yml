name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Commit package-lock.json files (backend, frontend, e2e), then add `cache: npm` to setup-node for speed.

jobs:
  backend:
    name: Backend (lint, test, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci   # throw-away CI database, not a real credential
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npx prisma generate
      - name: Create initial migration if none is committed
        run: sh scripts/gen-initial-migration.sh
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test
      - name: End-to-end API tests
        run: npm run test:e2e
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend (lint, test, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  repo-scan:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  images:
    name: Build, scan and push (${{ matrix.component }})
    needs: [backend, frontend, repo-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.component }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build image (kept local for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          target: runtime
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  e2e:
    name: Browser tests (Playwright against docker compose)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Generate .env with random secrets
        run: bash scripts/setup-env.sh
      - name: Create initial migration if none is committed
        run: docker compose run --rm --no-deps backend sh scripts/gen-initial-migration.sh
      - name: Start the stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/health/ready >/dev/null 2>&1 && curl -fsS http://localhost:5173 >/dev/null 2>&1 && exit 0
            sleep 3
          done
          echo "Stack did not become ready" >&2
          docker compose logs --tail=100
          exit 1
      - name: Run Playwright
        working-directory: e2e
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report

  deploy:
    name: Deploy to Kubernetes
    needs: [images, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Add required reviewers to the "production" environment (Settings > Environments) for the approval gate.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4
      - name: Configure cluster access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}   # base64-encoded kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Helm upgrade
        env:
          APP_URL: ${{ vars.APP_URL }}     # e.g. https://devforge.example.com
          APP_HOST: ${{ vars.APP_HOST }}   # e.g. devforge.example.com
          SHA: ${{ github.sha }}
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          helm upgrade --install devforge helm/devforge \
            --namespace devforge --create-namespace \
            --atomic --timeout 8m \
            --set fullnameOverride=devforge \
            --set backend.image.repository="$repo/backend" --set backend.image.tag="$SHA" \
            --set frontend.image.repository="$repo/frontend" --set frontend.image.tag="$SHA" \
            --set config.APP_URL="$APP_URL" --set config.CORS_ORIGIN="$APP_URL" \
            --set ingress.host="$APP_HOST"
      - name: Smoke test
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: curl --fail --silent --show-error --retry 10 --retry-delay 5 --retry-connrefused "$APP_URL/healthz"

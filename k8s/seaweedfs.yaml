# Local S3-compatible storage for attachments. In the cloud use S3 (or another managed object store)
# and set the S3_* values instead. Pin the image tag once you choose a version.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels: { app: seaweedfs }
  template:
    metadata:
      labels: { app: seaweedfs }
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              cat > /tmp/s3.json <<EOF
              {"identities":[{"name":"app","credentials":[{"accessKey":"$S3_ACCESS_KEY_ID","secretKey":"$S3_SECRET_ACCESS_KEY"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
              EOF
              exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json
          env:
            - name: S3_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: devforge-secrets, key: S3_ACCESS_KEY_ID } }
            - name: S3_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: devforge-secrets, key: S3_SECRET_ACCESS_KEY } }
          ports:
            - { name: s3, containerPort: 8333 }
          readinessProbe:
            tcpSocket: { port: s3 }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
spec:
  selector: { app: seaweedfs }
  ports:
    - { name: s3, port: 8333, targetPort: s3 }

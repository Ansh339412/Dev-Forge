# Requires the Prometheus Operator (e.g. kube-prometheus-stack). The "release" label must match
# your Prometheus' serviceMonitorSelector (kube-prometheus-stack defaults to release=<helm release name>).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: devforge-backend
  namespace: devforge
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels: { app: backend }
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s

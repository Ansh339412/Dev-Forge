# Loaded by the local Prometheus. In Kubernetes, convert these into a PrometheusRule.
groups:
  - name: devforge
    rules:
      - alert: BackendDown
        expr: min(up{job="devforge-backend"}) == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "DevForge backend is not being scraped (down?)" }
      - alert: HighErrorRate
        expr: >
          sum(rate(http_request_duration_seconds_count{status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_request_duration_seconds_count[5m])), 1e-9) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "More than 5% of requests are failing with 5xx" }
      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "p95 latency has been above 1s for 10 minutes" }
